# SwiftLint configuration for MediStock.
# The CI "lint" job runs non-blocking for now (see .github/workflows/ci.yml),
# so this favours useful signal over strictness.

included:
  - MediStock
  - MediStockTests
  - MediStockUITests

excluded:
  - MediStock/Preview Content
  - "**/*.generated.swift"

analyzer_rules:
  - unused_declaration
  - unused_import

opt_in_rules:
  - empty_count
  - empty_string
  - closure_spacing
  - contains_over_first_not_nil
  - first_where
  - last_where
  - toggle_bool
  - redundant_nil_coalescing
  - explicit_init
  - overridden_super_call
  - prohibited_super_call
  - unneeded_parentheses_in_closure_argument

disabled_rules:
  - todo

line_length:
  warning: 140
  ignores_urls: true
  ignores_comments: true

identifier_name:
  min_length: 2
  excluded:
    - id
    - to
    - vm

type_name:
  max_length:
    warning: 45

function_body_length:
  warning: 80

type_body_length:
  warning: 400

file_length:
  warning: 500
  ignore_comment_only_lines: true

reporter: "xcode"
